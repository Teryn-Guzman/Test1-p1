<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>ImageLab</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="shell">
	<header><p class="eyebrow">IMAGE PROCESSING</p><h1>Make more from your image.</h1><p class="lede">Choose an image, and get three ready-to-use versions.</p></header>
	<section class="workspace">
		<form id="upload-form" class="panel upload-panel">
			<div class="panel-heading"><span class="step">01</span><h2>Choose an image</h2></div>
			<label class="dropzone" for="image-input"><input id="image-input" type="file" accept="image/jpeg,image/png"><span class="drop-icon">+</span><strong>Select a JPEG or PNG</strong><small>Maximum 10 MB</small></label>
			<div id="selection" class="selection hidden"><img id="preview" alt="Local preview"><div><strong id="filename"></strong><p id="file-meta"></p></div></div>
			<button id="process-button" type="submit" disabled>Process image <span>-></span></button>
			<p id="upload-error" class="error" role="alert"></p>
		</form>
		<section class="panel job-panel"><div class="panel-heading"><span class="step">02</span><h2>Processing status</h2></div><div id="job-card" class="empty-state"><strong>No active job</strong><span>Submit an image to begin.</span></div></section>
	</section>
	<section class="results-section"><div class="section-heading"><div><p class="eyebrow">03 / OUTPUT</p><h2>Generated images</h2></div><span id="result-count" class="count">0 files</span></div><div id="results" class="results empty-state"><strong>No images generated yet</strong><span>Completed variants will appear here.</span></div></section>
</main><script type="module" src="app.js?v=3"></script>
</body></html>
